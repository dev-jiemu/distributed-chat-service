# Server Configuration
server:
  port: 8080
  shutdown:
    graceful-shutdown-timeout: 10s  # SIGTERM 후 최대 대기 시간

# Custom Application Properties
app:
  server-id: ${SERVER_ID:server1}

  # Server Heartbeat Configuration
  heartbeat:
    interval: 5        # 하트비트 갱신 간격 (초)
    ttl: 15            # Redis TTL (초) — interval의 3배로 유지
    threshold: 10      # 서버를 죽었다고 판단하는 기준 (초)

  # Rate Limiting Configuration (모든 사용자 동일)
  rate-limit:
    limit: 200              # 분당 최대 메시지 수
    burst: 100              # 버스트 허용 (한번에 보낼 수 있는 최대 개수)
    token-ttl: 300          # Redis TTL (초) - 5분

  # Connection Control Configuration
  connection:
    max-connections-per-server: 1000      # 서버당 최대 동시 연결 수
    rate-limit:
      max-attempts: 10                    # IP당 윈도우 내 최대 연결 시도 횟수
      window-seconds: 60                  # 연결 시도 카운팅 윈도우 (초)
    idle-timeout-minutes: 10              # idle 판단 기준 시간 (분)
    cleanup-interval-ms: 300000           # idle 세션 정리 주기 (ms, 기본 5분)

# JWT Configuration
jwt:
  secret: dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1jaGF0LWFwcGxpY2F0aW9uLTIwMjQ=
  access-token-expiration: 3600000    # 1시간
  refresh-token-expiration: 604800000  # 7일

# Spring Configuration
spring:
  # H2 Configuration (In-memory for testing/development)
  datasource:
    url: jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10 # H2는 동시 쓰기가 가능하므로 풀 사이즈 증가

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update # 애플리케이션 시작 시 스키마 업데이트 (H2는 인메모리이므로 create-drop도 가능)
    # H2는 별도의 dialect 설정이 필요 없음 (Spring Boot가 자동으로 감지)
    show-sql: true
  
  # SQL 스크립트 자동 실행
  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql
      continue-on-error: true  # 중복 데이터 에러 무시

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          time-between-eviction-runs: 30s
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    virtual-host: /
    # STOMP over WebSocket을 위한 추가 설정
    # RabbitMQ STOMP 플러그인이 61613 포트에서 실행되어야 함
    # 명령어: rabbitmq-plugins enable rabbitmq_stomp rabbitmq_web_stomp
    stomp:
      host: localhost
      port: 61613
      login: admin
      passcode: admin
    
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

# Logging Configuration
logging:
  level:
    com.example.chat: DEBUG
    org.springframework.messaging: INFO
    org.springframework.web.socket: INFO
    org.springframework.amqp: INFO
